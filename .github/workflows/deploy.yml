name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas exigidas pelas ações oficiais de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita publicações simultâneas; uma nova execução cancela a anterior ainda em andamento.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      # O nome real do repositório vira o subdiretório do site: /<repositório>/
      # (nenhum nome fixo é necessário; funciona mesmo se você renomear o repositório).
      - name: Gerar o build de produção
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o artefato (pasta dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
